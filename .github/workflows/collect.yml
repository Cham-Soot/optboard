name: 옵션 시세 수집

on:
  schedule:
    - cron: "12 7 * * 1-5"  # 16:12 KST
    - cron: "36 9 * * 1-5"  # 18:36 KST, dated daily quotes only
  workflow_dispatch:
    inputs:
      expiry:
        description: "특정 월물 YYYYMM (비우면 설정한 월물)"
        required: false
      date:
        description: "실제 거래일 YYYY-MM-DD (비우면 실행일)"
        required: false
      retry:
        description: "자동 재시도 횟수 (0~4)"
        required: false
        default: "0"

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: optboard-write
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      code: ${{ steps.collect.outputs.code }}
      retry: ${{ steps.collect.outputs.retry }}
      detail: ${{ steps.collect.outputs.detail }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet openpyxl==3.1.5
      - name: 거래일 확인 및 시세 수집
        id: collect
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          KIS_ENV: real
          INPUT_EXPIRY: ${{ inputs.expiry }}
          INPUT_DATE: ${{ inputs.date }}
          INPUT_RETRY: ${{ inputs.retry }}
        run: python scripts/run_collection.py
      - name: 성공한 시세와 수집 상태 먼저 보존
        run: |
          python scripts/verify_public.py
          git config user.name option-collector
          git config user.email actions@users.noreply.github.com
          git add data/[0-9][0-9][0-9][0-9].json data/optcodes.json data/calendar.json data/collection_status.json
          if ! git diff --staged --quiet; then
            git commit -m "시세 및 수집 상태 보존"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: 기존 만기 알림 유지
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/notify_expiry.py
      - name: 만기 지난 공개 시세 보관
        id: archive
        continue-on-error: true
        run: python scripts/archive.py
      - name: 공개 화면 생성 및 검사
        run: |
          python scripts/build_viewer.py --recent 3
          python scripts/verify_public.py
          git add data/index.json index.html archive
          if ! git diff --staged --quiet; then
            git commit -m "공개 시세 화면 갱신"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: 일시적 연결 오류만 새 실행으로 재시도
        if: always() && steps.collect.outputs.code == '3' && steps.collect.outputs.retry != '4'
        env:
          GH_TOKEN: ${{ github.token }}
          RETRY: ${{ steps.collect.outputs.retry }}
          INPUT_DATE: ${{ steps.collect.outputs.date }}
          INPUT_EXPIRY: ${{ inputs.expiry }}
        run: |
          gh workflow run collect.yml --ref "$GITHUB_REF_NAME" -f retry="$((RETRY+1))" -f date="$INPUT_DATE" -f expiry="$INPUT_EXPIRY"
      - name: 보관 오류 보고
        if: steps.archive.outcome == 'failure'
        run: exit 1

  pages:
    needs: collect
    if: always() && needs.collect.result != 'cancelled'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml

  result:
    needs: [collect, pages]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 당일 수집 및 배포 결과 확인
        env:
          CODE: ${{ needs.collect.outputs.code }}
          COLLECT_RESULT: ${{ needs.collect.result }}
          PAGES_RESULT: ${{ needs.pages.result }}
          DETAIL: ${{ needs.collect.outputs.detail }}
        run: |
          printf '%s\n' "$DETAIL" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "0" ]; then
            printf '::error::%s\n' "시세 수집 확인 필요 (코드 $CODE): $DETAIL"
            exit 1
          fi
          if [ "$COLLECT_RESULT" != "success" ] || [ "$PAGES_RESULT" != "success" ]; then
            printf '::error::%s\n' "저장 또는 배포 실패: 수집 작업=$COLLECT_RESULT, 배포=$PAGES_RESULT"
            exit 1
          fi
