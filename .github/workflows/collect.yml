name: 옵션 시세 수집

on:
  schedule:
    # GitHub 예약 실행은 지연되거나 통째로 빠질 수 있습니다 (공식 문서에 명시).
    # 그래서 하루 두 번 잡습니다 — 본 실행과 예비 실행. 수집은 같은 날짜를
    # 덮어쓰는 방식이라 두 번 돌아도 안전하고, 빠진 날은 다음 실행이 스스로 메웁니다.
    - cron: "12 7 * * 1-5"   # 16:12 KST — 본 실행 (옵션 정규장 마감 15:45 이후)
    - cron: "36 9 * * 1-5"   # 18:36 KST — 예비 실행 (본 실행이 빠졌을 때 대비)
  workflow_dispatch:
    inputs:
      expiry:
        description: "특정 월물만 수집 (예: 202609). 비우면 근월물+차월물"
        required: false
      date:
        description: "기록할 날짜 (예: 2026-08-31). 비우면 오늘"
        required: false

permissions:
  contents: write
  issues: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 종목코드 마스터 갱신 (앱키 불필요)
        run: python3 scripts/master.py || echo "마스터를 못 받았습니다 — 전광판만으로 진행합니다"

      - name: 거래소 달력 갱신 (하루 1회, 6개월 앞을 못 덮을 때만)
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          KIS_ENV: real
        run: python3 scripts/calendar_sync.py

      - name: 시세 수집 (+ 빠진 날 자동 메우기)
        env:
          KIS_APPKEY: ${{ secrets.KIS_APPKEY }}
          KIS_APPSECRET: ${{ secrets.KIS_APPSECRET }}
          KIS_ENV: real
        run: |
          ARGS=""
          [ -n "${{ inputs.expiry }}" ] && ARGS="$ARGS --expiry ${{ inputs.expiry }}"
          [ -n "${{ inputs.date }}" ]   && ARGS="$ARGS --date ${{ inputs.date }}"
          python3 scripts/collect.py $ARGS

      - name: 만기 알림 (D-3부터, 월물당 한 번)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if OUT=$(python3 scripts/expiry_notice.py --github); then
            TITLE=$(echo "$OUT" | head -1)
            BODY=$(echo "$OUT" | sed -n '/---BODY---/,$p' | tail -n +2)
            TAG=$(echo "$TITLE" | sed 's/.*(\(.*\))/\1/')
            if gh issue list --state all --search "$TAG in:title" --json title \
               | grep -q "$TAG"; then
              echo "이미 알린 만기입니다 ($TAG)"
            else
              gh issue create --title "$TITLE" --body "$BODY" --label "만기" \
                || gh issue create --title "$TITLE" --body "$BODY" \
                || echo "이슈를 만들지 못했습니다 (Issues 가 꺼져 있을 수 있습니다)"
            fi
          else
            echo "만기까지 아직 여유가 있습니다."
          fi

      - name: 만기 지난 월물 봉인
        run: |
          pip install --quiet openpyxl
          python3 scripts/archive.py

      - name: 뷰어 다시 만들기
        run: python3 scripts/build_viewer.py --recent 3

      - name: 변경분 저장
        run: |
          git config user.name  "option-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data archive index.html
          if git diff --staged --quiet; then
            echo "바뀐 내용 없음 — 휴장일이거나 이미 최신입니다."
          else
            git commit -m "수집 $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            # 그 사이 내가 marks.json 등을 올렸을 수 있으므로 먼저 당겨서 얹는다
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" || true
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
